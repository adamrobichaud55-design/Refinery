<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SmartWeld 3D Catalogue</title>
<style>
  /* one light look on every device: a phone in dark mode must not turn the controls' text white on this white panel */
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; font: 13px/1.4 system-ui, sans-serif; color: #1b1f24; background: #f4f5f7; }
  button, select, input, textarea { color: #1b1f24; color-scheme: light; }
  select, input:not([type=checkbox]), textarea { background: #fff; border: 1px solid #c8ccd2; border-radius: 3px; }
  #info button { background: #fff; border: 1px solid #c8ccd2; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
  #app { display: grid; grid-template-columns: 230px 1fr 380px; height: 100%; }
  #list { overflow: auto; min-height: 0; border-right: 1px solid #d0d4da; background: #fff; }
  #list h1 { font-size: 14px; margin: 10px 12px 4px; }
  #list .sub { margin: 0 12px 8px; color: #666; font-size: 11px; }
  #list h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #666; margin: 12px 12px 2px; }
  #list button { display: block; width: 100%; text-align: left; border: 0; background: none; color: #1b1f24; padding: 5px 12px; cursor: pointer; font: inherit; }
  #list form button, #list .cfg button { display: inline-block; width: auto; background: #fff; border: 1px solid #c8ccd2; border-radius: 4px; padding: 3px 10px; }
  #list button:hover { background: #eef2f7; }
  #list button.active { background: #dbe7f6; font-weight: 600; }
  #list form { margin: 10px 12px; display: flex; gap: 4px; }
  #list .cfg { margin: 4px 12px 8px; display: flex; flex-wrap: wrap; gap: 4px; }
  #list .cfg select { font: inherit; max-width: 100%; }
  #list input { flex: 1; min-width: 0; font: inherit; padding: 3px 6px; border: 1px solid #c8ccd2; border-radius: 3px; }
  #view { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
  /* the canvas is drawn at up to twice the screen resolution; its on-screen size is always its box */
  #view canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #err { position: absolute; z-index: 6; left: 12px; bottom: 12px; color: #b00020; background: #fff; padding: 4px 8px; border-radius: 3px; display: none; }
  #info { overflow: auto; min-height: 0; border-left: 1px solid #d0d4da; background: #fff; padding: 12px; }
  #info h2 { margin: 0 0 4px; font-size: 16px; }
  #info .cat { color: #666; margin-bottom: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { text-align: left; padding: 3px 4px; border-bottom: 1px solid #eceef1; vertical-align: top; }
  td.v { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .b-drawing { color: #0a5; } .b-rule { color: #a60; } .b-constant { color: #06a; } .b-regulation { color: #808; }
  #profile { width: 100%; height: 220px; border: 1px solid #eceef1; margin: 8px 0; background: #fafbfc; }
  .notes { color: #555; font-size: 12px; }
  .legend { font-size: 11px; color: #666; margin-top: 10px; }
  .demo-note { color: #d0021b; font-weight: 700; border: 2px solid #d0021b; padding: 4px 6px; font-size: 11px; margin-bottom: 6px; }
  table.itp td, table.itp th { font-size: 11px; padding: 2px 3px; } table.itp input { font: inherit; width: 100%; box-sizing: border-box; } table.itp select { font: inherit; }
  #info a { color: #1f5fbf; }
  #menu-btn, #menu-shade { display: none; }
  /* phone width: the 3D view on top, the details below, the list as a slide-out menu */
  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 58% 42%; }
    #view { grid-row: 1; touch-action: none; }
    #info { grid-row: 2; border-left: 0; border-top: 1px solid #d0d4da; padding: 12px max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
    #list { position: fixed; z-index: 20; top: 0; bottom: 0; left: 0; width: min(86vw, 330px); border-right: 1px solid #d0d4da; box-shadow: 0 0 24px rgba(27, 31, 36, .25);
      padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); transform: translateX(-105%); transition: transform .2s ease; }
    body.menu-open #list { transform: none; }
    #menu-btn { display: block; position: absolute; z-index: 5; top: calc(8px + env(safe-area-inset-top, 0px)); left: calc(8px + env(safe-area-inset-left, 0px));
      font: 600 13px system-ui, sans-serif; color: #1b1f24; background: #fff; border: 1px solid #c8ccd2; border-radius: 6px; padding: 8px 12px; }
    #menu-shade { position: fixed; inset: 0; z-index: 15; background: rgba(27, 31, 36, .35); }
    body.menu-open #menu-shade { display: block; }
    #list button { padding: 9px 12px; }
    table { font-size: 11px; } #info { -webkit-overflow-scrolling: touch; }
  }
  @media (prefers-reduced-motion: reduce) { #list { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <nav id="list">
    <h1>SmartWeld 3D Catalogue</h1>
    <div class="sub">Stages 1–8 — sections, shell, interior, valves, piping, ground truth, work orders, owner's drawings. Imperial. True scale.</div>
    <form id="typed"><input id="des" placeholder="Type a designation, e.g. W18x50" /><button type="submit">Go</button></form>
    <label class="sub"><input type="checkbox" id="section" /> Section view (cut on the stem plane)</label>
    <h2>Valve configurator</h2>
    <div class="cfg"><select id="vtype"></select><select id="vsize"></select><select id="vcls"></select><button id="vbuild" type="button">Build</button></div>
    <div id="entries"></div>
  </nav>
  <div id="view"><button id="menu-btn" type="button" aria-controls="list">Menu</button><div id="err"></div></div>
  <div id="menu-shade"></div>
  <aside id="info"></aside>
</div>
<script type="module" src="/src/viewer/main.ts"></script>
<script>
  // phone menu: open from the button, close on the shade or after choosing a view
  (function () {
    var b = document.body, btn = document.getElementById('menu-btn');
    btn.addEventListener('click', function () { b.classList.toggle('menu-open'); });
    document.getElementById('menu-shade').addEventListener('click', function () { b.classList.remove('menu-open'); });
    document.getElementById('list').addEventListener('click', function (e) { var t = e.target; if (t && t.tagName === 'BUTTON') b.classList.remove('menu-open'); });
    document.getElementById('typed').addEventListener('submit', function () { b.classList.remove('menu-open'); });
  })();
</script>
</body>
</html>
