<!doctype html><meta charset="utf-8"><title>scene dev</title>
<style>html,body{margin:0;height:100%;background:#000}canvas{display:block;width:100vw;height:100vh}</style>
<!-- Developer view of the 3D scene in ../scene/. tour.render(frame) draws any point of the planned route (0 to 239). -->
<div id="s" style="height:100vh"><canvas id="c"></canvas></div>
<script src="../photo3d.bundle.js"></script>
<script>fetch('../scene/scene.json').then(r => r.json()).then(scene => { window.tour = Scene3D({ canvas: document.getElementById('c'), section: document.getElementById('s'), base: '../scene/', scene, still: true }); window.tour.ready.then(() => { window.ready = true; }); });</script>
