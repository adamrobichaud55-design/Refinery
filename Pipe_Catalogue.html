<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartWeld Piping Component Catalog</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --edge:#222b36; --edge2:#2f3a47;
  --ink:#c9d4e0; --dim:#7c8b9c; --hot:#e8532b; --ok:#3fb950; --acc:#4a9eda;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:12px;overflow:hidden}
#wrap{display:flex;height:100%}
#side{width:262px;flex:0 0 262px;background:var(--panel);border-right:1px solid var(--edge);display:flex;flex-direction:column}
#brand{padding:12px 14px;border-bottom:1px solid var(--edge)}
#brand b{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
#brand span{display:block;margin-top:3px;color:var(--dim);font-size:10px;letter-spacing:.06em}
#list{flex:1;overflow-y:auto;padding:6px 0}
.grp{padding:9px 14px 4px;color:var(--dim);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase}
.it{display:flex;align-items:baseline;gap:8px;padding:5px 14px;cursor:pointer;border-left:2px solid transparent;color:var(--ink)}
.it:hover{background:#1c2430}
.it.on{background:#1f2a38;border-left-color:var(--hot)}
.it .sk{color:var(--dim);font-size:9.5px;min-width:38px}
.it .nm{font-size:11px}
#main{flex:1;position:relative;display:flex;flex-direction:column;min-width:0}
#bar{display:flex;align-items:center;gap:14px;padding:9px 14px;border-bottom:1px solid var(--edge);background:var(--panel);flex-wrap:wrap}
#bar .lbl{color:var(--dim);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase}
.chip{background:#1c2430;border:1px solid var(--edge2);color:var(--ink);padding:3px 8px;border-radius:2px;cursor:pointer;font-family:var(--mono);font-size:11px}
.chip:hover{border-color:var(--acc)}
.chip.on{background:var(--hot);border-color:var(--hot);color:#fff}
.chip:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#view{flex:1;position:relative;min-height:0}
#cv{display:block;width:100%;height:100%}
#info{display:none;position:absolute;left:14px;bottom:14px;background:rgba(13,17,23,.9);border:1px solid var(--edge2);padding:10px 12px;max-width:min(560px,60%);line-height:1.65}
#info h4{margin:0 0 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);font-weight:600}
#info table{border-collapse:collapse;font-size:11px}
#info td{padding:1px 12px 1px 0;color:var(--dim);white-space:nowrap}
#info td.v{color:var(--ink)}
#src{margin-top:7px;padding-top:6px;border-top:1px solid var(--edge);color:var(--dim);font-size:10px}
#src b{color:var(--acc);font-weight:400}
#hint{position:absolute;right:14px;bottom:14px;color:var(--dim);font-size:10px;text-align:right;line-height:1.6}
#sizes{display:flex;gap:5px;flex-wrap:wrap}
@media(max-width:820px){#side{width:190px;flex-basis:190px}#info{max-width:75%}}
</style>
</head>
<body>
<div id="wrap">
  <div id="side">
    <div id="brand"><b>Piping Catalog</b><span>parametric solids, ASME dimensions</span></div>
    <div id="list"></div>
  </div>
  <div id="main">
    <div id="bar">
      <span class="lbl">Size</span><span id="sizes"></span>
      <span style="flex:1"></span>
      <button class="chip" id="bCut">Section cut</button>
      <button class="chip" id="bWire">Wireframe</button>
      <button class="chip on" id="bSpin">Rotate</button>
      <button class="chip" id="bFit">Fit view</button>
    </div>
    <div id="view"><canvas id="cv"></canvas>
      <div id="info"></div>
      <div id="hint">drag orbit &middot; wheel zoom<br>right-drag pan</div>
    </div>
  </div>
</div>

  var R1=RO(big),r1=RI(big),R2=RO(sml),r2=RI(sml),t1=0.5,t2=0.5;
  if(!ecc){
    g.add(solid([[r1,0],[R1,0],[R1,t1],[R2,H-t2],[R2,H],[r2,H],[r2,H-t2],[r1,t1]]));
  }else{
    var off=R1-R2, pos=[],idx=[],ring=48,i,k;
    var lev=[[R1,r1,0,0],[R1,r1,t1,0],[R2,r2,H-t2,off],[R2,r2,H,off]];
    for(k=0;k<lev.length;k++)for(i=0;i<=ring;i++){var a=i/ring*Math.PI*2;
      pos.push(Math.cos(a)*lev[k][0],lev[k][2],Math.sin(a)*lev[k][0]+0);}
    for(k=0;k<lev.length;k++)for(i=0;i<=ring;i++){var a2=i/ring*Math.PI*2;
      pos.push(Math.cos(a2)*lev[k][1],lev[k][2],Math.sin(a2)*lev[k][1]);}
    var geo=new THREE.BufferGeometry();
    var P=[],N=lev.length,S=ring+1;
    for(k=0;k<N;k++)for(i=0;i<S;i++){var a3=i/ring*Math.PI*2;P.push(Math.cos(a3)*lev[k][0],lev[k][2],Math.sin(a3)*lev[k][0]+lev[k][3]);}
    for(k=0;k<N;k++)for(i=0;i<S;i++){var a4=i/ring*Math.PI*2;P.push(Math.cos(a4)*lev[k][1],lev[k][2],Math.sin(a4)*lev[k][1]+lev[k][3]);}
    var F=[];
    function quad(a,b,c,d){F.push(a,b,c,a,c,d);}
    for(k=0;k<N-1;k++)for(i=0;i<ring;i++){quad(k*S+i,k*S+i+1,(k+1)*S+i+1,(k+1)*S+i);}
    var o=N*S;
    for(k=0;k<N-1;k++)for(i=0;i<ring;i++){quad(o+(k+1)*S+i,o+(k+1)*S+i+1,o+k*S+i+1,o+k*S+i);}
    for(i=0;i<ring;i++){quad(0+i,o+i,o+i+1,0+i+1);}
    var lb=(N-1)*S;
    for(i=0;i<ring;i++){quad(lb+i+1,o+lb+i+1,o+lb+i,lb+i);}
    geo.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
    geo.setIndex(F); geo.computeVertexNormals();
    g.add(new THREE.Mesh(geo,MAT.steel));
  }
  return {g:g,std:'ASME B16.9',dims:[['Large end',fnps(big)],['Small end',fnps(sml)],
    ['Length',fx(H)+'"'],['Large OD',fx(OD(big))+'"'],['Small OD',fx(OD(sml))+'"'],
    ['Type',ecc?'Eccentric, flat side':'Concentric']]};
}

function genSO(cl,n,sw){

  var tf=flgT(cl,n);

  if(!rfInc(cl)) Y+=rh;

  var sd=sw?(SW3000[n]?SW3000[n].J:0.50):0;
  g.add(solid([[rb,0],[rf/2,0],[rf/2,rh],[rb,rh]],MAT.face));
  var ys=Y-sd;                      /* socket shoulder position */
  if(sw&&ys<tf){
    g.add(boltPlate(O,ys-rh,ri,bc,nb,hd,rh));
    g.add(boltPlate(O,tf-ys,ro,bc,nb,hd,ys));
  }else{
    g.add(boltPlate(O,tf-rh,rb,bc,nb,hd,rh));

  /* short cylindrical hub with an end chamfer */
  var hb=sw?((ys>=tf)?[[ri,tf],[X/2,tf],[X/2,Y-0.08],[X/2-0.08,Y],[ro,Y],[ro,ys],[ri,ys]]
                     :[[ro,tf],[X/2,tf],[X/2,Y-0.08],[X/2-0.08,Y],[ro,Y]])
           :[[rb,tf],[X/2,tf],[X/2,Y-0.08],[X/2-0.08,Y],[rb,Y]];

  if(sw){dims.push(['Socket bore',fx(OD(n))+'"'],['Socket depth',fx(sd)+'"']);}
  else{dims.push(['Bore, slip fit',fx(rb*2)+'"']);}

/* ============================================================
   MEASURED VENDOR MODELS
   The five components below are rebuilt from the supplied vendor
   3D CAD models (TraceParts DWG -> ACIS solids). Every dimension
   was measured from the analytic surfaces of those solids, in mm,
   and is reproduced here at native size; other size chips scale
   the measured geometry proportionally.
     GF Piping CR4W030          316 SS weldolet   (PVDF insert removed)
     AVK 02-200-66-003          gate valve, DN200 PN10, EN 558-2 S.15
     Bonney Forge 1-31-RF WCB   globe valve, 3 in Class 150 RF
     Bonney Forge 1-61-RF WCB   swing check valve, 10 in Class 150 RF
     Andrex DP-3k DN150         welded-body flanged ball valve
     Comer BUT10110             uPVC wafer butterfly valve, d110
   ============================================================ */
function fmm(v){return Math.round(v)+' mm ('+fx(v/25.4)+'")';}
/* Lathe about +Y whose lower edge is clamped to a run-pipe saddle.
   prof = outer profile [r,y] bottom->top (mm); bore = inner radius;
   run axis is along X at height yAxis, radius Rrun. */
function saddleLathe(prof,bore,Rrun,yAxis,mat){
  var pts=prof.slice();
  if(bore!=null){
    pts.push([bore,prof[prof.length-1][1]]);
    pts.push([bore,prof[0][1]]);
  }
  var NT=88,rows=pts.length,P=[],F=[],k,j;
  for(k=0;k<rows;k++)for(j=0;j<=NT;j++){
    var a=j/NT*Math.PI*2,r=pts[k][0],x=r*Math.cos(a),z=r*Math.sin(a);
    var ys=yAxis+Math.sqrt(Math.max(Rrun*Rrun-z*z,0));
    P.push(x,Math.max(pts[k][1],ys),z);
  }
  for(k=0;k<rows-1;k++)for(j=0;j<NT;j++){
    var a1=k*(NT+1)+j,b1=(k+1)*(NT+1)+j;
    F.push(a1,b1,b1+1,a1,b1+1,a1+1);
  }
  var geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  geo.setIndex(F); geo.computeVertexNormals();
  return new THREE.Mesh(geo,mat||MAT.steel);
}
/* Sample a convex blend arc r(y)=rc+sqrt(R^2-(y-yc)^2) between y0..y1. */
function blendArc(rc,R,yc,y0,y1,N){
  var p=[],i;
  for(i=0;i<=N;i++){var y=y0+(y1-y0)*i/N;
    p.push([rc+Math.sqrt(Math.max(R*R-(y-yc)*(y-yc),0)),y]);}
  return p;
}
/* Spoke cylinder from (r0,y0) to (r1,y1) at azimuth a about +Y. */
function spoke(r0,y0,r1,y1,a,rad,mat){
  var dr=r1-r0,dy=y1-y0,L=Math.sqrt(dr*dr+dy*dy);
  var m=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,L,10),mat||MAT.steel);
  var g=new THREE.Group(); m.position.y=L/2; g.add(m);
  g.rotation.z=-Math.atan2(dr,dy);
  var h=new THREE.Group(); h.add(g);
  h.position.set(r0*Math.cos(a),y0,r0*Math.sin(a));
  h.rotation.y=-a;
  return h;
}
/* ----- GF CR4W030 weldolet, PVDF insert removed ----- */
function genWeldoletGF(nr,nb){
  var sb=RO(nb)*25.4/21.08;         /* scale so outlet OD matches branch pipe */
  var Rrun=RO(nr)*25.4;             /* saddle follows the selected run, mm */
  var g=G(),M=G(),i;
  var yAxis=-34.29*sb-Rrun;         /* run centreline below the shoulder datum */
  /* outer profile measured from the solid, mm, scaled by sb */
  var prof=[];
  blendArc(3.45,28.96,-28.99,-43.1,-29.97,7).forEach(function(p){prof.push(p);});
  prof.push([32.38,-10.92]);
  blendArc(12.63,19.81,-12.42,-10.92,0,7).forEach(function(p){prof.push(p);});
  prof.push([28.07,0],[21.08,0],[21.08,20.57]);
  for(i=0;i<prof.length;i++){prof[i]=[prof[i][0]*sb,prof[i][1]*sb];}
  prof[0][1]=yAxis;                  /* bottom edge clamps up onto the saddle */
  M.add(saddleLathe(prof,18.29*sb,Rrun,yAxis));
  /* reference run pipe */
  var ctx=tube(RI(nr)*25.4,Rrun,-Rrun*2.4,Rrun*2.4,MAT.ctx);
  ctx.rotation.z=Math.PI/2; ctx.position.y=yAxis; M.add(ctx);
  g.add(M); g.scale.setScalar(1/25.4);
  return {g:g,noRot:true,std:'Measured from GF Piping CR4W030 3D model (TraceParts) — 316 SS weldolet, PVDF insert removed',
    dims:[['Run size',fnps(nr)],['Branch size',fnps(nb)],['Outlet OD',fmm(42.16*sb)],
      ['Metal bore',fmm(36.58*sb)],['Base diameter',fmm(64.76*sb)],
      ['Height above run crown',fmm(54.86*sb)],['Outlet end','Butt weld'],
      ['Insert','PVDF insert removed']],
    note:'Body profile measured at native size and scaled to the branch; saddle is cut to the selected run OD'};

var NORD143={1:[5.5,4.3,3.8,1.9,1.06,0.81,0.9],1.5:[6.5,5.0,4.1,2.1,1.38,1.00,1.0],
 2:[7.0,6.0,4.7,2.4,1.38,1.00,1.0],2.5:[7.5,7.0,4.7,2.4,1.38,1.00,1.0],
 3:[8.0,7.5,5.6,3.4,1.75,1.25,1.3],4:[9.0,9.0,6.3,4.0,1.75,1.25,1.3],

function genPlugNordstrom(n){
  var t=NORD143[n]; if(!t) return null;

  var f=flg(150,n), bc=f[4], nbolt=f[5], hd=f[6];
  var g=G(), M=G(), ri=RI(n), tf=flgT(150,n)-0.06;
  [-1,1].forEach(function(sg){
    var y0=sg*B/2, d=(sg>0)?1:-1;

  g.add(solid([[0,F*0.92+jt],[rj*0.97,F*0.92+jt],[rj*0.97,F*0.92+jt*2],[0,F*0.92+jt*2]],M,48));
  ringStuds(6,rj*0.86,rj*0.86,F*0.022,F*0.92,F*0.92+jt*2,g);

  g.add(solid([[0,F*2.37],[F*0.18,F*2.37],[F*0.18,F*2.58],[F*0.15,F*2.63],[0,F*2.63]],M,40));

/* ============================================================
   VALVES.  Every dimension below is read from VLV; nothing is
   proportional unless the catalogue leaves the cell empty.
   Bodies follow the generic catalogue look: painted cast gate,
   check and butterfly bodies, stainless globe, ball and plug
   bodies, blue handwheels and levers.
   ============================================================ */
function opFallback(kind,cl,n){return {H:stemH(n,cl),W:wheelDia(n,cl),est:true};}
function opOf(t,cl,n){
  if(t[2]!=null&&t[3]!=null) return {H:t[2],W:t[3],est:false};
  return opFallback(null,cl,n);
}
/* One valve end at yf, hub/socket growing inward by dir (+1 or -1).
   end: 'FL' raised-face flange, 'BW' butt-weld bevel, 'SW' socket weld,
   'TH' threaded NPT. Returns the inset (how far the body starts from yf). */
function endNm(e){return {FL:'Flanged RF',BW:'Butt weld',SW:'Socket weld',TH:'Threaded NPT'}[e||'FL'];}
function vEndX(cl,n,yf,dir,d,end,g,mat){
  var ri=(d!=null?d/2:RI(n)), ro=RO(n), m=mat||MAT.steel;
  if(end==='SW'){
    var sb=ro+0.03, band=ro+Math.max(WALL(n)*1.3,0.14)+0.05,
        J=Math.min(Math.max(OD(n)*0.55,0.4),1.1), bl=J*1.45;
    var s=socketBand(band,sb,ri,J,bl); s.material=m; if(dir<0) s.rotation.x=Math.PI; s.position.y=yf; g.add(s);
    return bl;
  }
  if(end==='TH'){
    var stub=Math.max(OD(n)*0.75,0.9);
    g.add(tube(ri,ro,Math.min(yf,yf+dir*stub),Math.max(yf,yf+dir*stub),m));
    for(var i=0;i<4;i++){var yy=yf+dir*(0.14+i*0.15);
      var tr=new THREE.Mesh(new THREE.TorusGeometry(ro*0.98,Math.max(ro*0.035,0.02),6,32),MAT.face);
      tr.rotation.x=Math.PI/2; tr.position.y=yy; g.add(tr);}
    return stub*0.6;
  }
  if(end==='BW'){
    var Lb=Math.max(OD(n)*0.45,0.6), land=Math.max(WALL(n)*0.35,0.05), bv=Math.min((ro-ri)*0.85,Lb*0.6);
    g.add(solid([[ri,yf],[ri+land,yf],[ro,yf+dir*bv],[ro,yf+dir*Lb],[ri,yf+dir*Lb]],m));
    return Lb;
  }
  g.add(rfFlange(cl,n,yf,dir,d,m).g);         /* FL default */
  return flgY(cl,n);
}
/* Both ends facing inward, port bore d, end type applied to each. */
function vEnds(cl,n,L,d,g,end,mat){
  var e1=vEndX(cl,n,-L/2,1,d,end,g,mat);
  vEndX(cl,n,L/2,-1,d,end,g,mat);
  return e1;
}
/* Flow passage between the flange hubs, wall scaled off the port. */
function vRunner(d,L,e,g,mat){

function genSolenoid(n){

  var top=G();
  top.add(oval([[0,-s*0.22],[0.7,-s*0.21],[1,-s*0.1],[1,s*0.1],[0.9,s*0.24],[0,s*0.24]],s*0.20,s*0.24,M));

  top.add(hexTube(s*0.36,0,s*0.42,s*0.09,M));

  top.add(rbox(cw,cd,ch,y0,s*0.05,MAT.blk));
  var din=rbox(s*0.2,s*0.3,s*0.36,y0+s*0.07,s*0.03,MAT.blk); din.position.x=-cw/2-s*0.1; top.add(din);
  for(var k=0;k<3;k++){var rb=new THREE.Mesh(new THREE.BoxGeometry(s*0.02,s*0.24,s*0.02),MAT.blk);
    rb.position.set(-cw/2-s*0.2,y0+s*0.25,-s*0.06+k*s*0.06); top.add(rb);}

function genThreeWay(n){
  var cl=150, t=vlv('globe',cl,n); if(!t) return null;

  var e=vEnds(cl,n,L,d,g,'FL',M), ro=vRunner(d,L,e,g,M);

  var top=G(), bw=Math.min(u*0.76,room*1.96);

  top.add(solid([[0,-u*0.52],[u*0.18,-u*0.52],[u*0.2,-u*0.43],[0,-u*0.43]],M,32));

  var rs=u*0.38, ft=u*0.095, y1=u*0.39;
  top.add(solid([[0,y1],[rs,y1],[rs,y1+ft],[0,y1+ft]],M,48));

  ringStuds(8,rs*0.84,rs*0.84,u*0.02,y1,y1+ft*2,top);
  var yb=y1+ft*2;
  top.add(solid([[0,yb],[u*0.13,yb],[u*0.13,u*0.74],[0,u*0.74]],M,32));
  top.add(hexTube(u*0.22,0,u*0.74,u*0.07,M));
  top.add(solid([[0,u*0.81],[u*0.1,u*0.81],[u*0.1,u*0.87],[0,u*0.87]],M,24));

 {grp:'Manufacturer models',id:'MVYFL',skey:'VYFL',name:'Butterfly, uPVC Comer BUT 10',sz:[63,75,90,110,160,225].map(function(d){return {lab:'Ø'+d,f:function(){return genBflyComer(d);}};})},

 {grp:'Supports',id:'DUCK',skey:'DUCK',name:'Dummy leg, welded',sz:S1([2,3,4,6,8,10,12],genDummyLeg)},
 {grp:'Supports',id:'01HG',skey:'01HG',name:'Pipe shoe / rest',sz:S1([2,3,4,6,8,10,12,14,16],genPipeShoe)},
 {grp:'Supports',id:'ANCH',skey:'ANCH',name:'Anchor / stanchion',sz:S1([2,3,4,6,8,10,12,14,16],genAnchor)},
 {grp:'Supports',id:'SPRG',skey:'SPRG',name:'Spring hanger',sz:S1([2,3,4,6,8,10,12],genSpringHanger)},
 {grp:'Supports',id:'20BL',skey:'20BL',name:'Pipe clamp / U-bolt rest',sz:S1([2,3,4,6,8,10,12,14,16],genPipeClamp)},

 {grp:'Plates',id:'SB',skey:'SB',name:'Spectacle blind, Class 300',sz:S1([3,4,6,8,10,12],function(n){return genSpecBlind(300,n);})},
 {grp:'Plates',id:'OP',skey:'OP',name:'Orifice plate, Class 300',sz:S1([3,4,6,8,10,12],function(n){return genOrificePlate(300,n);})}
];

/* ============================================================ SCENE */
var scene,cam,rnd,root,clip,spin=true,cut=false,wire=false;
var cur={ci:0,si:0}, theta=-0.72, phi=1.18, dist=40, target=new THREE.Vector3();
function initScene(){
  var cv=document.getElementById('cv');
  rnd=new THREE.WebGLRenderer({canvas:cv,antialias:true});
  rnd.setPixelRatio(Math.min(devicePixelRatio,2));
  rnd.localClippingEnabled=true;
  scene=new THREE.Scene(); scene.background=new THREE.Color(0x0d1117);
  cam=new THREE.PerspectiveCamera(38,1,0.1,4000);
  scene.add(new THREE.HemisphereLight(0xdfe8f2,0x2a3038,0.85));
  var k=new THREE.DirectionalLight(0xffffff,0.85); k.position.set(1,1.6,1.1); scene.add(k);
  var f=new THREE.DirectionalLight(0x9fc4ea,0.35); f.position.set(-1.2,0.4,-1); scene.add(f);
  root=new THREE.Group(); scene.add(root);
  clip=new THREE.Plane(new THREE.Vector3(0,0,1),0);
  initEnv(rnd); initMat();
  addEventListener('resize',resize); resize();
  var d=false,px=0,py=0,btn=0;
  cv.addEventListener('pointerdown',function(e){d=true;btn=e.button;px=e.clientX;py=e.clientY;cv.setPointerCapture(e.pointerId);});
  cv.addEventListener('pointerup',function(e){d=false;});
  cv.addEventListener('pointermove',function(e){
    if(!d)return; var dx=e.clientX-px,dy=e.clientY-py; px=e.clientX;py=e.clientY;
    if(btn===2){var s=dist*0.0016; target.x-=dx*s; target.y+=dy*s;}
    else{theta-=dx*0.008; phi=Math.max(0.12,Math.min(Math.PI-0.12,phi-dy*0.008)); spin=false; setChip('bSpin',false);}
  });
  cv.addEventListener('contextmenu',function(e){e.preventDefault();});
  cv.addEventListener('wheel',function(e){e.preventDefault();dist*=(e.deltaY>0?1.09:0.917);},{passive:false});
}
function resize(){
  var v=document.getElementById('view');
  rnd.setSize(v.clientWidth,v.clientHeight,false);
  cam.aspect=v.clientWidth/v.clientHeight; cam.updateProjectionMatrix();
}
function setChip(id,on){document.getElementById(id).classList.toggle('on',on);}
function applyStyle(){
  for(var k in MAT){MAT[k].wireframe=wire; MAT[k].clippingPlanes=cut?[clip]:[]; MAT[k].needsUpdate=true;}
}
function fit(){
  var b=new THREE.Box3().setFromObject(root); if(b.isEmpty())return;
  var c=b.getCenter(new THREE.Vector3()), s=b.getSize(new THREE.Vector3());
  target.copy(c); dist=Math.max(s.x,s.y,s.z)*1.95+3;
}
function build(){
  while(root.children.length) root.remove(root.children[0]);
  var c=CAT[cur.ci], e=c.sz[Math.min(cur.si,c.sz.length-1)], r=null;
  try{ r=e.f(); }catch(err){ console.error(err); }
  if(!r){ document.getElementById('info').innerHTML='<h4>Not available</h4>'; return; }
  var g=r.g; if(!r.noRot) g.rotation.z=-Math.PI/2;
  root.add(g); fit(); applyStyle();
  var h='<h4>'+c.name+'  <span style="color:var(--dim)">'+e.lab+(c.skey?'  \u00b7  SKEY '+c.skey:'')+'</span></h4><table>';
  r.dims.forEach(function(d){h+='<tr><td>'+d[0]+'</td><td class="v">'+d[1]+'</td></tr>';});
  h+='</table><div id="src">Dimensions from <b>'+r.std+'</b>'+(r.note?'<br>'+r.note:'')+'</div>';
  document.getElementById('info').innerHTML=h;
}
function drawList(){
  var L=document.getElementById('list'),h='',g0='';
  CAT.forEach(function(c,i){
    if(c.grp!==g0){h+='<div class="grp">'+c.grp+'</div>';g0=c.grp;}
    h+='<div class="it'+(i===cur.ci?' on':'')+'" data-i="'+i+'"><span class="sk">'+(c.skey||'\u2014')+'</span><span class="nm">'+c.name+'</span></div>';
  });
  L.innerHTML=h;
  Array.prototype.forEach.call(L.querySelectorAll('.it'),function(el){
    el.onclick=function(){cur.ci=+el.dataset.i;cur.si=Math.min(cur.si,CAT[cur.ci].sz.length-1);drawList();drawSizes();build();};
  });
}
function drawSizes(){
  var S=document.getElementById('sizes'),c=CAT[cur.ci],h='';
  c.sz.forEach(function(s,i){h+='<button class="chip'+(i===cur.si?' on':'')+'" data-i="'+i+'">'+s.lab+'</button>';});
  S.innerHTML=h;
  Array.prototype.forEach.call(S.querySelectorAll('.chip'),function(el){
    el.onclick=function(){cur.si=+el.dataset.i;drawSizes();build();};
  });
}
function loop(){
  requestAnimationFrame(loop);
  if(spin) theta+=0.0042;
  cam.position.set(target.x+dist*Math.sin(phi)*Math.cos(theta),target.y+dist*Math.cos(phi),target.z+dist*Math.sin(phi)*Math.sin(theta));
  cam.lookAt(target); rnd.render(scene,cam);
}
(function(){
  initScene();
  document.getElementById('bCut').onclick=function(){cut=!cut;setChip('bCut',cut);applyStyle();};
  document.getElementById('bWire').onclick=function(){wire=!wire;setChip('bWire',wire);applyStyle();};
  document.getElementById('bSpin').onclick=function(){spin=!spin;setChip('bSpin',spin);};
  document.getElementById('bFit').onclick=function(){fit();};
  cur.ci=CAT.findIndex(function(c){return c.id==='FLWN300';}); if(cur.ci<0)cur.ci=0; cur.si=7;
  drawList(); drawSizes(); build(); loop();
})();
</script></body></html>
