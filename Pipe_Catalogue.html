<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartWeld Piping Component Catalog</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --edge:#222b36; --edge2:#2f3a47;
  --ink:#c9d4e0; --dim:#7c8b9c; --hot:#e8532b; --ok:#3fb950; --acc:#4a9eda;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:12px;overflow:hidden}
#wrap{display:flex;height:100%}
#side{width:262px;flex:0 0 262px;background:var(--panel);border-right:1px solid var(--edge);display:flex;flex-direction:column}
#brand{padding:12px 14px;border-bottom:1px solid var(--edge)}
#brand b{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
#brand span{display:block;margin-top:3px;color:var(--dim);font-size:10px;letter-spacing:.06em}
#list{flex:1;overflow-y:auto;padding:6px 0}
.grp{padding:9px 14px 4px;color:var(--dim);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase}
.it{display:flex;align-items:baseline;gap:8px;padding:5px 14px;cursor:pointer;border-left:2px solid transparent;color:var(--ink)}
.it:hover{background:#1c2430}
.it.on{background:#1f2a38;border-left-color:var(--hot)}
.it .sk{color:var(--dim);font-size:9.5px;min-width:38px}
.it .nm{font-size:11px}
#main{flex:1;position:relative;display:flex;flex-direction:column;min-width:0}
#bar{display:flex;align-items:center;gap:14px;padding:9px 14px;border-bottom:1px solid var(--edge);background:var(--panel);flex-wrap:wrap}
#bar .lbl{color:var(--dim);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase}
.chip{background:#1c2430;border:1px solid var(--edge2);color:var(--ink);padding:3px 8px;border-radius:2px;cursor:pointer;font-family:var(--mono);font-size:11px}
.chip:hover{border-color:var(--acc)}
.chip.on{background:var(--hot);border-color:var(--hot);color:#fff}
.chip:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#view{flex:1;position:relative;min-height:0}
#cv{display:block;width:100%;height:100%}
#info{display:none;position:absolute;left:14px;bottom:14px;background:rgba(13,17,23,.9);border:1px solid var(--edge2);padding:10px 12px;max-width:min(560px,60%);line-height:1.65}
#info h4{margin:0 0 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);font-weight:600}
#info table{border-collapse:collapse;font-size:11px}
#info td{padding:1px 12px 1px 0;color:var(--dim);white-space:nowrap}
#info td.v{color:var(--ink)}
#src{margin-top:7px;padding-top:6px;border-top:1px solid var(--edge);color:var(--dim);font-size:10px}
#src b{color:var(--acc);font-weight:400}
#hint{position:absolute;right:14px;bottom:14px;color:var(--dim);font-size:10px;text-align:right;line-height:1.6}
#sizes{display:flex;gap:5px;flex-wrap:wrap}
@media(max-width:820px){#side{width:190px;flex-basis:190px}#info{max-width:75%}}
</style>
</head>
<body>
<div id="wrap">
  <div id="side">
    <div id="brand"><b>Piping Catalog</b><span>parametric solids, ASME dimensions</span></div>
    <div id="list"></div>
  </div>
  <div id="main">
    <div id="bar">
      <span class="lbl">Size</span><span id="sizes"></span>
      <span style="flex:1"></span>
      <button class="chip" id="bCut">Section cut</button>
      <button class="chip" id="bWire">Wireframe</button>
      <button class="chip on" id="bSpin">Rotate</button>
      <button class="chip" id="bFit">Fit view</button>
    </div>
    <div id="view"><canvas id="cv"></canvas>
      <div id="info"></div>
      <div id="hint">drag orbit &middot; wheel zoom<br>right-drag pan</div>
    </div>
  </div>
</div>

/* Revolve a closed profile of [radius, y] pairs about the Y axis. */

/* Bend: circular arc of centreline radius R through ang radians,

function bend(R,ri,ro,ang,mat,noCaps){
  var g=new THREE.Group();
  var o=new THREE.Mesh(new THREE.TorusGeometry(R,ro,28,72,ang),mat||MAT.steel);
  var n=new THREE.Mesh(new THREE.TorusGeometry(R,ri,28,72,ang),mat||MAT.steel);
  g.add(o);g.add(n);
  if(!noCaps)[0,ang].forEach(function(a){
    var r=new THREE.Mesh(new THREE.RingGeometry(ri,ro,SEG),mat||MAT.steel);
    r.position.set(R*Math.cos(a),R*Math.sin(a),0);
    r.lookAt(new THREE.Vector3(R*Math.cos(a)-Math.sin(a),R*Math.sin(a)+Math.cos(a),0));

/* Flange plate carrying real bolt holes, extruded along Y. */
function boltPlate(O,tf,bore,bc,nb,hd,y,mat){ /* extrudes +Y from y */
  var sh=new THREE.Shape();
  sh.absarc(0,0,O/2,0,Math.PI*2,false);
  var h=new THREE.Path(); h.absarc(0,0,Math.max(bore,1e-3),0,Math.PI*2,true); sh.holes.push(h);
  for(var i=0;i<nb;i++){

    p.absarc(Math.cos(a)*bc/2,Math.sin(a)*bc/2,hd/2,0,Math.PI*2,true); sh.holes.push(p);

  var m=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:tf,bevelEnabled:false,curveSegments:48}),mat||MAT.steel);
  m.rotation.x=-Math.PI/2; m.position.y=y;

}
/* Studs through the bolt circle. */
function studs(bc,nb,hd,y0,y1){

    var s=new THREE.Mesh(new THREE.CylinderGeometry(hd/2*0.82,hd/2*0.82,y1-y0,14),MAT.bolt);
    s.position.set(Math.cos(a)*bc/2,(y0+y1)/2,Math.sin(a)*bc/2); g.add(s);

  var rh=rfh(cl), tf=flgT(cl,n), Y=flgY(cl,n);

/* Handwheel: rim, spokes, hub. */

/* ---------- true cylinder-cylinder tee ----------
   Run along X (outer Ro, bore Ri, half length C).
   Branch along +Y (outer rb, bore rbi, centre to end M).
   The run surfaces are cut at the saddle curve where the branch
   meets them; the exposed wall ring is closed with a collar. */
function teeMesh(Ro,Ri,C,rb,rbi,M,noCaps){
  var g=new THREE.Group(), NT=96, NX=72;
  function mesh(P,F){var geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
    geo.setIndex(F); geo.computeVertexNormals();
    return new THREE.Mesh(geo,MAT.steel);}
  /* run cylinder of radius R with a hole of radius holeR on top */
  function runSurf(R,holeR){
    var P=[],F=[],i,j;
    for(i=0;i<=NX;i++)for(j=0;j<=NT;j++){
      var x=-C+2*C*i/NX, th=j/NT*Math.PI*2, y=R*Math.cos(th), z=R*Math.sin(th);
      if(y>0 && x*x+z*z<holeR*holeR){
        var rr=Math.sqrt(x*x+z*z)||1e-6, s=holeR/rr;
        x*=s; z=Math.max(-R+1e-4,Math.min(R-1e-4,z*s));
        y=Math.sqrt(Math.max(R*R-z*z,0));
      }
      P.push(x,y,z);
    }
    function ins(i2,j2){var x=-C+2*C*i2/NX,th=j2/NT*Math.PI*2,y=R*Math.cos(th),z=R*Math.sin(th);
      return y>0&&x*x+z*z<holeR*holeR;}
    for(i=0;i<NX;i++)for(j=0;j<NT;j++){
      if(ins(i,j)&&ins(i+1,j)&&ins(i,j+1)&&ins(i+1,j+1)) continue;
      var a=i*(NT+1)+j,b=(i+1)*(NT+1)+j,c=(i+1)*(NT+1)+j+1,d=i*(NT+1)+j+1;
      F.push(a,b,c,a,c,d);
    }
    return mesh(P,F);
  }
  g.add(runSurf(Ro,rb)); g.add(runSurf(Ri,rbi));
  /* branch tubes rise from their saddle curves */
  function saddle(r,R,ph){var z=r*Math.sin(ph);return Math.sqrt(Math.max(R*R-z*z,0));}
  function branch(r,R){
    var P=[],F=[],j;
    for(j=0;j<=NT;j++){var ph=j/NT*Math.PI*2,x=r*Math.cos(ph),z=r*Math.sin(ph);
      P.push(x,saddle(r,R,ph),z); P.push(x,M,z);}
    for(j=0;j<NT;j++){var a=2*j,b=2*j+1,c=2*j+3,d=2*j+2;F.push(a,b,c,a,c,d);}
    return mesh(P,F);
  }
  g.add(branch(rb,Ro)); g.add(branch(rbi,Ri));
  /* collar closing the cut wall of the run around the hole */
  (function(){var P=[],F=[],j;
    for(j=0;j<=NT;j++){var ph=j/NT*Math.PI*2;
      P.push(rb*Math.cos(ph),saddle(rb,Ro,ph),rb*Math.sin(ph));
      P.push(rbi*Math.cos(ph),saddle(rbi,Ri,ph),rbi*Math.sin(ph));}
    for(j=0;j<NT;j++){var a=2*j,b=2*j+1,c=2*j+3,d=2*j+2;F.push(a,b,c,a,c,d);}
    g.add(mesh(P,F));})();
  /* end faces */
  if(!noCaps)[-C,C].forEach(function(x){
    var r=new THREE.Mesh(new THREE.RingGeometry(Ri,Ro,SEG),MAT.steel);
    r.rotation.y=Math.PI/2; r.position.x=x; g.add(r);
  });
  if(!noCaps){
    var top=new THREE.Mesh(new THREE.RingGeometry(rbi,rb,SEG),MAT.steel);
    top.rotation.x=-Math.PI/2; top.position.y=M; g.add(top);
  }
  return g;
}

/* Socket end band: raised collar with an open counterbore.

function socketBand(B2,RO,RI,J,bl){

function genElbowSW(n,deg){

  var s2=socketBand(band,rs,ri,J,bl);

  s2.position.set(px+ux*(J+0.002),py+uy*(J+0.002),0);

function genReducer(n1,n2,ecc){

    for(k=0;k<lev.length;k++)for(i=0;i<=ring;i++){var a=i/ring*Math.PI*2;
      pos.push(Math.cos(a)*lev[k][0],lev[k][2],Math.sin(a)*lev[k][0]+0);}

   The five components below are rebuilt from the supplied vendor
   3D CAD models (TraceParts DWG -> ACIS solids). Every dimension
   was measured from the analytic surfaces of those solids, in mm,
   and is reproduced here at native size; other size chips scale
   the measured geometry proportionally.
     GF Piping CR4W030          316 SS weldolet   (PVDF insert removed)
     AVK 02-200-66-003          gate valve, DN200 PN10, EN 558-2 S.15
     Bonney Forge 1-31-RF WCB   globe valve, 3 in Class 150 RF
     Bonney Forge 1-61-RF WCB   swing check valve, 10 in Class 150 RF

   ============================================================ */
function fmm(v){return Math.round(v)+' mm ('+fx(v/25.4)+'")';}
/* Lathe about +Y whose lower edge is clamped to a run-pipe saddle.
   prof = outer profile [r,y] bottom->top (mm); bore = inner radius;
   run axis is along X at height yAxis, radius Rrun. */
function saddleLathe(prof,bore,Rrun,yAxis,mat){
  var pts=prof.slice();
  if(bore!=null){
    pts.push([bore,prof[prof.length-1][1]]);
    pts.push([bore,prof[0][1]]);
  }
  var NT=88,rows=pts.length,P=[],F=[],k,j;
  for(k=0;k<rows;k++)for(j=0;j<=NT;j++){
    var a=j/NT*Math.PI*2,r=pts[k][0],x=r*Math.cos(a),z=r*Math.sin(a);
    var ys=yAxis+Math.sqrt(Math.max(Rrun*Rrun-z*z,0));
    P.push(x,Math.max(pts[k][1],ys),z);
  }
  for(k=0;k<rows-1;k++)for(j=0;j<NT;j++){
    var a1=k*(NT+1)+j,b1=(k+1)*(NT+1)+j;
    F.push(a1,b1,b1+1,a1,b1+1,a1+1);
  }
  var geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  geo.setIndex(F); geo.computeVertexNormals();
  return new THREE.Mesh(geo,mat||MAT.steel);
}
/* Sample a convex blend arc r(y)=rc+sqrt(R^2-(y-yc)^2) between y0..y1. */
function blendArc(rc,R,yc,y0,y1,N){
  var p=[],i;
  for(i=0;i<=N;i++){var y=y0+(y1-y0)*i/N;
    p.push([rc+Math.sqrt(Math.max(R*R-(y-yc)*(y-yc),0)),y]);}
  return p;
}
/* Spoke cylinder from (r0,y0) to (r1,y1) at azimuth a about +Y. */
function spoke(r0,y0,r1,y1,a,rad,mat){
  var dr=r1-r0,dy=y1-y0,L=Math.sqrt(dr*dr+dy*dy);
  var m=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,L,10),mat||MAT.steel);
  var g=new THREE.Group(); m.position.y=L/2; g.add(m);
  g.rotation.z=-Math.atan2(dr,dy);
  var h=new THREE.Group(); h.add(g);
  h.position.set(r0*Math.cos(a),y0,r0*Math.sin(a));
  h.rotation.y=-a;
  return h;
}

var NORD143={1:[5.5,4.3,3.8,1.9,1.06,0.81,0.9],1.5:[6.5,5.0,4.1,2.1,1.38,1.00,1.0],

var FLGN=Object.keys(FLG[150]).map(Number).sort(function(a,b){return a-b;});
function nextFlgNPS(n){for(var i=0;i<FLGN.length;i++){if(FLGN[i]>n+1e-6)return FLGN[i];}return FLGN[FLGN.length-1];}
/* Spiral-wound gasket, RF: inner ring, winding band, centring ring. */
function genGasket(cl,n){
  var f=flg(cl,n), ID=OD(n)*0.96, rf=f[7], bc=f[4], hd=f[6];
  var wOD=rf-0.12, cOD=bc-hd-0.10, t=0.175, g=G();
  g.add(solid([[ID/2,-t*0.30],[ID/2+0.14,-t*0.30],[ID/2+0.14,t*0.30],[ID/2,t*0.30]],MAT.steel));
  g.add(solid([[ID/2+0.14,-t/2],[wOD/2,-t/2],[wOD/2,t/2],[ID/2+0.14,t/2]],MAT.trim,72));
  g.add(solid([[wOD/2+0.06,-t*0.35],[cOD/2,-t*0.35],[cOD/2,t*0.35],[wOD/2+0.06,t*0.35]],MAT.steel));
  return {g:g,std:'ASME B16.20 spiral wound, Class '+cl+', RF',dims:[['Nominal size',fnps(n)],
    ['Class',cl],['Inner dia',fx(ID)+'"'],['Winding OD',fx(wOD)+'"'],['Centring ring OD',fx(cOD)+'"'],
    ['Thickness',fx(t,1000)+'"'],['Windings','316SS / flexible graphite']]};
}
/* Pipe-support dummy leg: a capped pipe stub welded to the run. */
function genDummyLeg(n){
  var g=G(), ro=RO(n), ri=RI(n), L=Math.max(OD(n)*7,9);
  g.add(tube(ri,ro,0,L));
  g.add(genCap(n).g);                                  /* welded cap on the foot */
  var runR=RO(nextNPS(nextNPS(n)));
  var run=tube(runR-WALL(n),runR,-runR*3,runR*3,MAT.ctx);
  run.rotation.x=Math.PI/2; run.position.y=L+ro*0.6; g.add(run);
  return {g:g,noRot:true,std:'Pipe support, welded dummy leg (SKEY DUCK)',dims:[['Leg size',fnps(n)],
    ['Leg length',fx(L)+'"'],['Outside diameter',fx(OD(n))+'"'],['Foot','Butt-weld cap'],
    ['Attach','Welded to run pipe (shown)']],note:'Run pipe shown for reference'};
}
/* Welded pipe shoe / rest support: run pipe on a T-shoe and base bar. */
function genPipeShoe(n){
  var g=G(), ro=RO(n), L=Math.max(OD(n)*4,10), H=Math.max(OD(n)*0.9,2.2);
  var run=tube(RI(n),ro,-L/2,L/2,MAT.steel); run.rotation.z=Math.PI/2; g.add(run);
  var web=new THREE.Mesh(new THREE.BoxGeometry(L*0.66,H,0.42),MAT.steel); web.position.y=-ro-H/2; g.add(web);
  var base=new THREE.Mesh(new THREE.BoxGeometry(L*0.66,0.5,ro*2.0),MAT.steel); base.position.y=-ro-H-0.25; g.add(base);
  return {g:g,noRot:true,std:'Pipe support, welded shoe / rest (SKEY 01HG)',dims:[['Line size',fnps(n)],
    ['Shoe height',fx(H)+'"'],['Shoe length',fx(L*0.66)+'"'],['Type','Welded tee shoe on base'],
    ['Attach','Welded to run, rests on steel']],note:'Run pipe shown for reference'};
}
/* Anchor / stanchion: pipe clamped to a stub column and base plate. */
function genAnchor(n){
  var g=G(), ro=RO(n), L=Math.max(OD(n)*3,7), H=Math.max(OD(n)*1.6,4);
  var run=tube(RI(n),ro,-L/2,L/2,MAT.steel); run.rotation.z=Math.PI/2; g.add(run);
  var band=new THREE.Mesh(new THREE.TorusGeometry(ro+0.16,0.24,10,32),MAT.blk); band.rotation.y=Math.PI/2; g.add(band);
  var col=new THREE.Mesh(new THREE.CylinderGeometry(ro*0.6,ro*0.6,H,20),MAT.steel); col.position.y=-ro-H/2; g.add(col);
  var base=new THREE.Mesh(new THREE.BoxGeometry(ro*2.4,0.5,ro*2.4),MAT.steel); base.position.y=-ro-H-0.25; g.add(base);
  return {g:g,noRot:true,std:'Pipe anchor / stanchion (SKEY ANCH)',dims:[['Line size',fnps(n)],
    ['Column height',fx(H)+'"'],['Clamp','U-band around pipe'],['Base','Bolted base plate'],
    ['Type','Fixed anchor / vertical stanchion']],note:'Run pipe shown for reference'};

/* Variable spring hanger: pipe clamp, hanger rod, spring can, top bracket. */
function genSpringHanger(n){

  var run=tube(RI(n),ro,-L/2,L/2,MAT.steel); run.rotation.z=Math.PI/2; g.add(run);
  var band=new THREE.Mesh(new THREE.TorusGeometry(ro+0.13,0.2,10,32),MAT.blk); band.rotation.y=Math.PI/2; g.add(band);
  var rod=new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.18,rodH,12),MAT.trim); rod.position.y=ro+rodH/2; g.add(rod);
  var can=new THREE.Mesh(new THREE.CylinderGeometry(ro*0.95,ro*0.95,ro*2.0,24),MAT.steel); can.position.y=ro+rodH+ro; g.add(can);
  var brk=new THREE.Mesh(new THREE.BoxGeometry(ro*2.4,0.4,ro*1.5),MAT.ctx); brk.position.y=ro+rodH+ro*2.2; g.add(brk);

    ['Attach','Hung from steel above (shown)']],note:'Support steel shown for reference'};

/* Stud bolt set: studs and nuts on the flange bolt circle for a joint. */
function genStudBolts(cl,n){
  var f=flg(cl,n), bc=f[4], nb=f[5], hd=f[6];
  var span=flgT(cl,n)*2+0.18+hd*1.1;                   /* two flange thicknesses + gasket + thread stick-out */
  var g=G();
  g.add(studs(bc,nb,hd,-span/2,span/2));
  /* faint gasket ring at the joint to read as an assembled set */
  g.add(solid([[f[7]/2*0.7,-0.02],[f[7]/2,-0.02],[f[7]/2,0.02],[f[7]/2*0.7,0.02]],MAT.ctx));
  return {g:g,std:'ASME B16.5 stud bolt set, Class '+cl+' joint',
    dims:[['Flange size',fnps(n)],['Class',cl],['Quantity',nb+' studs'],
      ['Stud dia',fx(hd-0.12)+'" (through '+fx(hd)+'" holes)'],['Bolt circle',fx(bc)+'"'],
      ['Length',fx(span)+'"'],['Ends','Two heavy hex nuts']],
    note:'Stud length covers two flanges plus gasket at this class'};
}
/* Pipe clamp / U-bolt support on a welded base — simple rest support. */
function genPipeClamp(n){
  var g=G(), ro=RO(n), L=Math.max(OD(n)*3,7), H=Math.max(OD(n)*0.7,1.8);
  var run=tube(RI(n),ro,-L/2,L/2,MAT.steel); run.rotation.z=Math.PI/2; g.add(run);
  /* U-bolt over the pipe */
  var u=new THREE.Mesh(new THREE.TorusGeometry(ro+0.14,0.14,10,28,Math.PI),MAT.bolt);
  u.rotation.y=Math.PI/2; g.add(u);
  [-1,1].forEach(function(s){
    var leg=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,ro+H,10),MAT.bolt);
    leg.position.set(0,-(ro+H)/2+ro,s*(ro+0.14)); g.add(leg);
    var nut=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,0.2,6),MAT.bolt);
    nut.position.set(0,-ro-H*0.4,s*(ro+0.14)); g.add(nut);
  });
  /* base bar / channel the pipe rests on */
  var base=new THREE.Mesh(new THREE.BoxGeometry(L*0.5,0.5,ro*2.6),MAT.steel);
  base.position.y=-ro-H*0.5; g.add(base);
  return {g:g,noRot:true,std:'Pipe clamp / U-bolt rest support (SKEY 20BL)',
    dims:[['Line size',fnps(n)],['Clamp','U-bolt with nuts'],['Base','Welded channel / bar'],
      ['Type','Simple rest / hold-down'],['Attach','Bolted to steel']],note:'Support steel shown for reference'};
}
/* Inline instrument: flanged spool with a transmitter head and dial. */
function genInlineInstr(cl,n){
  var L=Math.max(OD(n)*3.5,7), d=RI(n)*2, g=G();
  var e=vEnds(cl,n,L,d,g), ro=vRunner(d,L,e,g);
  var top=G();
  var neck=new THREE.Mesh(new THREE.CylinderGeometry(ro*0.55,ro*0.7,ro*0.9,20),MAT.steel);
  neck.position.y=ro*0.9/2+ro*0.4; top.add(neck);
  var can=new THREE.Mesh(new THREE.CylinderGeometry(ro*0.85,ro*0.85,ro*1.4,24),MAT.steel);
  can.position.y=ro*1.4/2+ro*1.25; top.add(can);
  var dial=new THREE.Mesh(new THREE.CylinderGeometry(ro*0.7,ro*0.7,0.2,28),MAT.face);
  dial.rotation.x=Math.PI/2; dial.position.set(0,ro*1.95,ro*0.86); top.add(dial);
  top.rotation.z=Math.PI/2; g.add(top);
  return {g:g,std:'Inline instrument, flanged Class '+cl+' (SKEY IIBW/FE)',dims:[['Line size',fnps(n)],
    ['Class',cl],['Face to face',fx(L)+'"'],['Body','Flanged spool'],['Head','Transmitter with local dial']]};
}
/* Spring-loaded pressure relief valve, angle body, flanged. */
function genReliefValve(n){
  var cl=150, no=nextFlgNPS(n), g=G();
  g.add(rfFlange(cl,n,0,-1).g);                          /* inlet flange, faces down */
  var ro=RO(n)*1.5;
  g.add(tube(RI(n),RO(n),0,ro*1.4));                     /* inlet neck */
  var body=new THREE.Mesh(new THREE.SphereGeometry(ro*1.35,28,20),MAT.steel);
  body.scale.set(1,1.25,1); body.position.y=ro*1.4+ro*0.7; g.add(body);
  /* outlet: side nozzle + flange pointing +X, one size up */
  var oy=ro*1.4+ro*0.5, olen=RO(no)*2.4;
  var out=G();
  out.add(tube(RI(no),RO(no),0,olen));
  var ofl=rfFlange(cl,no,olen,1); out.add(ofl.g);
  out.rotation.z=-Math.PI/2; out.position.y=oy; g.add(out);   /* lay nozzle along +X */
  /* spring bonnet, cap and open lifting lever up top */
  var by=ro*1.4+ro*1.9;
  g.add(solid([[0,by-ro*0.5],[ro*0.95,by-ro*0.5],[ro*0.8,by],[ro*0.8,by+ro*2.2],[0,by+ro*2.2]],MAT.steel,28));
  var cap=new THREE.Mesh(new THREE.CylinderGeometry(ro*0.5,ro*0.85,ro*0.7,20),MAT.steel);
  cap.position.y=by+ro*2.2+ro*0.35; g.add(cap);
  var lift=new THREE.Mesh(new THREE.CylinderGeometry(ro*0.12,ro*0.12,ro*1.6,12),MAT.op);
  lift.rotation.z=Math.PI/2; lift.position.set(ro*0.8,by+ro*2.6,0); g.add(lift);
  return {g:g,noRot:true,std:'Spring-loaded pressure relief valve, flanged (SKEY RAFL/PSV), API 526',
    dims:[['Inlet',fnps(n)],['Outlet',fnps(no)],['Body','Angle, spring bonnet'],
    ['Inlet end','Flanged RF, Class '+cl],['Outlet end','Flanged RF, Class '+cl],
    ['Operation','Spring, with lifting lever']],note:'Inlet one size below outlet, per API convention'};
}
/* Equipment nozzle: weld-neck flange on a set-on stub off a vessel shell. */
function genNozzle(cl,n){
  var g=G(), proj=Math.max(OD(n)*1.6,5), shellR=Math.max(OD(n)*3.2,14);
  var wn=genWN(cl,n).g; wn.rotation.x=Math.PI; wn.position.y=proj; g.add(wn);
  g.add(tube(RI(n),RO(n),0,proj));
  var pts=[],N=24,i;
  for(i=0;i<=N;i++){var a=-Math.PI/2+Math.PI*i/N; pts.push([shellR*Math.cos(a)*0+RO(n),0]);}
  var shell=new THREE.Mesh(new THREE.CylinderGeometry(shellR,shellR,shellR*2.2,48,1,true),MAT.ctx);
  shell.rotation.x=Math.PI/2; shell.position.y=-shellR+RO(n)*0.3; g.add(shell);
  return {g:g,noRot:true,std:'Equipment nozzle, weld-neck flange Class '+cl+' (SKEY nozzle/N)',
    dims:[['Nozzle size',fnps(n)],['Class',cl],['Projection',fx(proj)+'"'],
    ['Flange','Weld neck RF, drilled'],['Shell','Set-on, vessel wall shown']],note:'Vessel shell shown for reference'};
}
/* Coupling, Class 3000, socket weld or threaded; full or half. */
function genCoupling(n,half){
  var d=SW3000[n]||{B:OD(n)*1.15,J:OD(n)*0.5,D:OD(n)*0.86,C:0.2,G:0.16};
  var ro=d.B/2+d.C+0.06, ri=d.D/2, J=d.J, L=half?J+0.35:J*2+0.4, g=G();
  g.add(solid([[ri,0],[ro,0],[ro,L],[ri,L]]));           /* body outer wall */
  g.add(solid([[d.B/2,0],[ri,0],[ri,J],[d.B/2,J]],MAT.face));            /* lower socket bore */
  if(!half) g.add(solid([[d.B/2,L],[ri,L],[ri,L-J],[d.B/2,L-J]],MAT.face)); /* upper socket bore */
  return {g:g,std:'ASME B16.11 Class 3000 '+(half?'half ':'full ')+'coupling',
    dims:[['Nominal size',fnps(n)],[half?'Half coupling':'Full coupling',half?'One socket':'Two sockets'],
    ['Socket bore',fx(d.B,1000)+'"'],['Socket depth',fx(J,1000)+'"'],['Outside dia',fx(ro*2)+'"'],
    ['Ends',half?'Socket weld / run weld':'Socket weld both ends']]};
}
/* ============================================================
   VALVES.  Every dimension below is read from VLV; nothing is
   proportional unless the catalogue leaves the cell empty.
   ============================================================ */
function opFallback(kind,cl,n){return {H:stemH(n,cl),W:wheelDia(n,cl),est:true};}
function opOf(t,cl,n){
  if(t[2]!=null&&t[3]!=null) return {H:t[2],W:t[3],est:false};
  return opFallback(null,cl,n);
}
/* One valve end at yf, hub/socket growing inward by dir (+1 or -1).
   end: 'FL' raised-face flange, 'BW' butt-weld bevel, 'SW' socket weld,
   'TH' threaded NPT. Returns the inset (how far the body starts from yf). */
function endNm(e){return {FL:'Flanged RF',BW:'Butt weld',SW:'Socket weld',TH:'Threaded NPT'}[e||'FL'];}
function vEndX(cl,n,yf,dir,d,end,g){
  var ri=(d!=null?d/2:RI(n)), ro=RO(n);
  if(end==='SW'){
    var sb=ro+0.03, band=ro+Math.max(WALL(n)*1.3,0.14)+0.05,
        J=Math.min(Math.max(OD(n)*0.55,0.4),1.1), bl=J*1.45;
    var s=socketBand(band,sb,ri,J,bl); if(dir<0) s.rotation.x=Math.PI; s.position.y=yf; g.add(s);
    return bl;
  }
  if(end==='TH'){
    var stub=Math.max(OD(n)*0.75,0.9);
    g.add(tube(ri,ro,Math.min(yf,yf+dir*stub),Math.max(yf,yf+dir*stub)));
    for(var i=0;i<4;i++){var yy=yf+dir*(0.14+i*0.15);
      var tr=new THREE.Mesh(new THREE.TorusGeometry(ro*0.98,Math.max(ro*0.035,0.02),6,32),MAT.face);
      tr.rotation.x=Math.PI/2; tr.position.y=yy; g.add(tr);}
    return stub*0.6;
  }
  if(end==='BW'){
    var Lb=Math.max(OD(n)*0.45,0.6), land=Math.max(WALL(n)*0.35,0.05), bv=Math.min((ro-ri)*0.85,Lb*0.6);
    g.add(solid([[ri,yf],[ri+land,yf],[ro,yf+dir*bv],[ro,yf+dir*Lb],[ri,yf+dir*Lb]]));
    return Lb;
  }
  g.add(rfFlange(cl,n,yf,dir,d).g);           /* FL default */
  return flgY(cl,n);
}
/* Both ends facing inward, port bore d, end type applied to each. */
function vEnds(cl,n,L,d,g,end){
  var e1=vEndX(cl,n,-L/2,1,d,end,g);
  vEndX(cl,n,L/2,-1,d,end,g);
  return e1;
}
/* Flow passage between the flange hubs, wall scaled off the port. */
function vRunner(d,L,e,g){
  var ri=d/2, ro=ri+Math.max(d*0.10,0.16), y=L/2-e;
  if(y>0.05) g.add(tube(ri,ro,-y,y));
  return ro;
}
/* Rising stem, packing boss and handwheel, built along +Y from the
   body crown at y0 up to the catalogue open height H. */
function vStem(n,y0,H,W,g){
  /* H is centre to top with the valve open, so the rim tops out at H */
  var sr=Math.max(n*0.05,0.13), t=Math.max(W*0.045,0.18), yw=H-t;
  g.add(solid([[0,y0],[Math.max(n*0.20,0.45),y0],[Math.max(n*0.17,0.38),y0+Math.max(n*0.22,0.5)],[0,y0+Math.max(n*0.22,0.5)]]));
  var st=new THREE.Mesh(new THREE.CylinderGeometry(sr,sr,Math.max(yw-y0,0.4),18),MAT.trim);
  st.position.y=(y0+yw)/2; g.add(st);
  g.add(handwheel(W,yw));
}
function genGate(cl,n,end){
  var t=vlv('gate',cl,n); if(!t) return null;
  var L=t[0],d=t[1],op=opOf(t,cl,n),g=G();
  var e=vEnds(cl,n,L,d,g,end), ro=vRunner(d,L,e,g);
  var fr=flg(cl,n)[0]/2, top=G();
  /* flattened wedge body, wide across the flow, slim on the face */
  var slab=new THREE.Mesh(new THREE.CylinderGeometry(ro*1.02,ro*1.62,fr*1.80,44),MAT.steel);
  slab.scale.z=0.54; slab.position.y=fr*1.80/2-fr*0.80; top.add(slab);
  vStem(n,fr*1.00,op.H,op.W,top);
  top.rotation.z=Math.PI/2; g.add(top);
  return {g:g,std:'COTESO Series 30 / API 6D, ASME B16.10 and B16.5 Class '+cl,
    dims:[['Nominal size',fnps(n)],['Class',cl],['End to end',fx(L)+'"'],['Port bore',fx(d)+'"'],
      ['Height, open',fx(op.H)+'"'],['Handwheel',fx(op.W)+'"'],
      ['Connection',endNm(end)],['Body','Solid or flexible wedge, OS&Y']],
    note:op.est?'Height and handwheel estimated, no catalogue value at this size':null};
}
function genGlobe(cl,n,end){
  var t=vlv('globe',cl,n); if(!t) return null;
  var L=t[0],d=t[1],op=opOf(t,cl,n),g=G();
  var e=vEnds(cl,n,L,d,g,end), ro=vRunner(d,L,e,g);
  var top=G(), R=ro*1.55;
  var pot=new THREE.Mesh(new THREE.SphereGeometry(R,40,28),MAT.steel);
  pot.scale.set(0.86,0.94,1.10); pot.position.y=-ro*0.12; top.add(pot);
  vStem(n,R*0.80,op.H,op.W,top);
  top.rotation.z=Math.PI/2; g.add(top);
  return {g:g,std:'COTESO Series 38 / BS 1873, ASME B16.10 and B16.5 Class '+cl,
    dims:[['Nominal size',fnps(n)],['Class',cl],['End to end',fx(L)+'"'],['Port bore',fx(d)+'"'],
      ['Height, open',fx(op.H)+'"'],['Handwheel',fx(op.W)+'"'],['Connection',endNm(end)],['Body','Globe, tee pattern']],
    note:op.est?'Height and handwheel estimated, no catalogue value at this size':null};
}
function genCheck(cl,n,end){
  var t=vlv('check',cl,n); if(!t) return null;
  var L=t[0],d=t[1],H=t[2],g=G();
  var e=vEnds(cl,n,L,d,g,end), ro=vRunner(d,L,e,g);
  var top=G(), cd=Math.max(d*0.62,ro*0.95);
  /* body swells over the seat, then a bolted cover up to H */
  var bh=Math.max(H*0.62,ro*1.15);
  top.add(solid([[0,bh],[cd,bh],[cd*1.02,bh*0.55],[ro*1.30,ro*0.10],[0,ro*0.10]]));
  var ct=Math.max((H-bh)*0.55,0.20);
  top.add(boltPlate(cd*2.05,ct,0.0001,cd*1.72,8,Math.max(n*0.075,0.34),bh));
  var dome=new THREE.Mesh(new THREE.SphereGeometry(cd*0.66,28,18),MAT.steel);
  dome.scale.y=Math.max((H-bh-ct)/(cd*0.66),0.25); dome.position.y=bh+ct; top.add(dome);
  top.rotation.z=Math.PI/2; g.add(top);
  return {g:g,std:'COTESO Series 48 / 53, API 6D, ASME B16.10 and B16.5 Class '+cl,
    dims:[['Nominal size',fnps(n)],['Class',cl],['End to end',fx(L)+'"'],['Port bore',fx(d)+'"'],
      ['Centre to top of cover',fx(H)+'"'],['Flange outside dia',fx(flg(cl,n)[0])+'"'],
      ['Connection',endNm(end)],['Body','Swing check, bolted cover'],['Operator','None']]};
}
function genBallFlanged(cl,n,end){
  var t=vlv('gate',cl,n); if(!t) return null;      /* B16.10 long pattern shares gate length */
  var L=t[0],d=t[1],g=G();
  var e=vEnds(cl,n,L,d,g,end), ro=vRunner(d,L,e,g);
  var R=ro*1.42, top=G(), P=Math.max(d*2.2,6);
  var body=new THREE.Mesh(new THREE.CylinderGeometry(R,R,Math.max(L*0.42,d*1.5),44),MAT.steel);
  body.rotation.z=Math.PI/2; g.add(body);
  var ball=new THREE.Mesh(new THREE.SphereGeometry(d*0.60,32,22),MAT.trim); g.add(ball);
  top.add(solid([[0,R*0.94],[R*0.42,R*0.94],[R*0.36,R*0.94+R*0.42],[0,R*0.94+R*0.42]]));
  var st=new THREE.Mesh(new THREE.CylinderGeometry(Math.max(n*0.05,0.14),Math.max(n*0.05,0.14),R*0.85,16),MAT.trim);
  st.position.y=R*1.15; top.add(st);
  top.add(lever(P,R*1.45)); top.rotation.z=Math.PI/2; g.add(top);
  return {g:g,std:'ASME B16.10 long pattern, Class '+cl+', '+endNm(end)+' ends',
    dims:[['Nominal size',fnps(n)],['Class',cl],['End to end',fx(L)+'"'],['Port bore',fx(d)+'"'],
      ['Lever length',fx(P)+'"'],['Connection',endNm(end)],['Body','Floating ball, long pattern'],['Operator','Hand lever']],
    note:'Lever length is proportional; the catalogue tabulates it only for forged sizes'};

function genButterfly(cl,n,lug){
  var t=vlv('bfly',cl,n); if(!t) return null;
  var L=t[0],H1=t[1],Do=t[2],g=G();
  var f=flg(cl,n), d=RI(n);
  var R=lug?(f[4]/2-f[6]*0.55):(f[7]/2);
  g.add(solid([[d/2,-L/2],[R,-L/2],[R,L/2],[d/2,L/2]]));
  if(lug){
    for(var i=0;i<f[5];i++){var a=(i+0.5)*Math.PI*2/f[5];
      var lu=new THREE.Mesh(new THREE.CylinderGeometry(f[6]*0.80,f[6]*0.80,L,18),MAT.steel);
      lu.position.set(Math.cos(a)*f[4]/2,0,Math.sin(a)*f[4]/2); g.add(lu);}
  }
  var disc=new THREE.Mesh(new THREE.CylinderGeometry(d*0.48,d*0.48,Math.max(L*0.16,0.14),48),MAT.face);
  disc.rotation.x=0.20; g.add(disc);
  var geared=(n>=8), top=G(), y0=R*0.96, lv=BFLY_LEV[n];
  var E=geared?Math.max((H1-Do/2-Do*0.15-y0)/0.85,R*0.35):(lv?lv[0]:R*0.55);
  var stem=new THREE.Mesh(new THREE.CylinderGeometry(Math.max(n*0.04,0.12),Math.max(n*0.04,0.12),d*0.5+y0+E*0.9,16),MAT.trim);
  stem.position.y=(y0+E*0.9-d*0.5)/2; top.add(stem);
  top.add(solid([[0,y0],[R*0.30,y0],[R*0.26,y0+E*0.75],[R*0.30,y0+E*0.75],[R*0.30,y0+E*0.85],[0,y0+E*0.85]]));
  var opTxt;
  if(geared){
    var gy=H1-Do/2;
    var gb=new THREE.Mesh(new THREE.BoxGeometry(Do*0.34,Do*0.30,Do*0.30),MAT.steel);
    gb.position.y=gy; top.add(gb);
    var hw=handwheel(Do,0); hw.rotation.x=Math.PI/2;
    hw.position.set(0,gy,Do*0.30); top.add(hw);
    var sh=new THREE.Mesh(new THREE.CylinderGeometry(Do*0.028,Do*0.028,Do*0.30,12),MAT.trim);
    sh.rotation.x=Math.PI/2; sh.position.set(0,gy,Do*0.16); top.add(sh);
    opTxt=['Operator','Worm gear, '+fx(Do)+'" handwheel'];
  }else{
    var P=lv?lv[1]:leverL(n);
    top.add(lever(P,y0+E*0.92));
    opTxt=['Operator','Hand lever, '+fx(P)+'" long'];
  }
  top.rotation.z=Math.PI/2; g.add(top);
  var dims=[['Nominal size',fnps(n)],['Class',cl],['Body thickness',fx(L)+'"'],
    ['Body outside dia',fx(R*2)+'"'],['Bolt circle',fx(f[4])+'"'],
    ['Type',lug?'Lugged, '+f[5]+' bosses':'Wafer'],opTxt];
  if(geared) dims.push(['Overall height',fx(H1)+'"']);
  return {g:g,std:'COTESO Series 85 / 88 / 98, API 609, Class '+cl,dims:dims};
}

function fEnds(n,L,g,sw){
  var ro=RO(n),ri=RI(n),sd=(SW3000[n]?SW3000[n].J:0.5),bl=Math.max(sd*1.5,0.5);
  [-1,1].forEach(function(s){
    var y0=s>0?L/2-bl:-L/2, y1=s>0?L/2:-L/2+bl;
    g.add(solid([[ri,y0],[ro*1.30,y0],[ro*1.30,y1],[sw?ro:ri,y1],[sw?ro:ri,s>0?y1-sd:y0+sd],[ri,s>0?y1-sd:y0+sd]]));
  });
  return bl;
}
function genForged(kind,n,sw){
  var t=vlv(kind,800,n); if(!t) return null;
  var L=t[0],d=t[1],H=t[2],W=t[3],g=G();
  var bl=fEnds(n,L,g,sw), R=Math.max(d*0.5+0.30,RO(n)*1.15);
  g.add(tube(d/2,R,-L/2+bl*0.9,L/2-bl*0.9));
  var top=G(), fr=R*1.75;
  if(kind==='check'){
    top.add(solid([[0,H],[fr*0.86,H*0.72],[fr*0.94,H*0.30],[R*1.05,R*0.10],[0,R*0.10]]));
    top.add(boltPlate(fr*1.62,Math.max(H*0.16,0.18),0.0001,fr*1.30,4,Math.max(n*0.14,0.26),H*0.72));
  }else{
    var body=new THREE.Mesh(new THREE.CylinderGeometry(R*1.18,R*1.55,fr*1.15,36),MAT.steel);
    body.scale.z=0.62; body.position.y=fr*1.15/2-fr*0.52; top.add(body);
    top.add(boltPlate(fr*1.55,Math.max(n*0.14,0.22),0.0001,fr*1.24,4,Math.max(n*0.11,0.20),fr*0.62));
    vStem(n,fr*0.78,H,W,top);
  }
  top.rotation.z=Math.PI/2; g.add(top);
  var nm={gate:'Gate',globe:'Globe',check:'Swing check'}[kind];
  var dims=[['Nominal size',fnps(n)],['Class',800],['End to end',fx(L)+'"'],['Bore',fx(d)+'"'],
    ['Ends',sw?'Socket weld, ASME B16.11':'NPT threaded, ASME B1.20.1']];
  if(kind==='check') dims.push(['Centre to top of cover',fx(H)+'"'],['Operator','None']);
  else dims.push(['Height, open',fx(H)+'"'],['Handwheel',fx(W)+'"']);
  dims.push(['Body',nm+', bolted bonnet']);
  return {g:g,std:'Neway E-FSV forged steel, API 602, Class 800',dims:dims};
}
function genBallForged(n,sw){
  var t=VLV.ball800[n]; if(!t) return null;
  var L=t[0],d=t[1],D=t[2],H=t[3],W=t[4],g=G();
  var ro=RO(n),ri=RI(n),bl=Math.max((SW3000[n]?SW3000[n].J:0.5)*1.5,0.5);
  g.add(solid([[d/2,-L*0.28],[D/2,-L*0.28],[D/2,L*0.28],[d/2,L*0.28]]));
  [-1,1].forEach(function(s){
    var y0=s>0?L*0.28:-L/2, y1=s>0?L/2:-L*0.28;
    g.add(solid([[ri,y0],[ro*1.28,y0],[ro*1.28,y1],[sw?ro:ri,y1],[sw?ro:ri,s>0?y1-bl*0.6:y0+bl*0.6],[ri,s>0?y1-bl*0.6:y0+bl*0.6]]));
  });
  var ball=new THREE.Mesh(new THREE.SphereGeometry(d*0.62,30,20),MAT.trim); g.add(ball);
  var top=G(), y0=D/2, yb=H-W*0.019;
  top.add(solid([[0,y0],[D*0.26,y0],[D*0.22,H*0.72],[0,H*0.72]]));
  var st=new THREE.Mesh(new THREE.CylinderGeometry(D*0.07,D*0.07,Math.max(yb-y0,0.3),14),MAT.trim);
  st.position.y=(y0+yb)/2; top.add(st);
  var bar=new THREE.Mesh(new THREE.BoxGeometry(Math.max(W*0.045,0.18),W*0.038,W),MAT.op);
  bar.position.set(0,yb,W/2-D*0.3); top.add(bar);
  var grip=new THREE.Mesh(new THREE.CylinderGeometry(W*0.026,W*0.026,W*0.26,14),MAT.op);
  grip.rotation.x=Math.PI/2; grip.position.set(0,yb,W-D*0.3-W*0.13); top.add(grip);
  top.rotation.z=Math.PI/2; g.add(top);
  return {g:g,std:'COTESO Series 60 floating ball, Class 800',
    dims:[['Nominal size',fnps(n)],['Class',800],['End to end',fx(L)+'"'],['Port bore',fx(d)+'"'],
      ['Body diameter',fx(D)+'"'],['Centre to top',fx(H)+'"'],['Lever length',fx(W)+'"'],
      ['Ends',sw?'Socket weld':'Female NPT'],['Body','Floating ball, two piece']]};
}
function genPlugValve(cl,n,end,op){
  var t=vlv('gate',cl||150,n); if(!t) return null;
  var L=t[0],d=t[1],g=G(),ro=RO(n),R=ro*1.55+0.35;
  var e=vEnds(cl||150,n,L,d,g,end);                    /* real end connections */
  vRunner(d,L,e,g);                                    /* flow bore between ends */
  /* tapered plug body */
  g.add(solid([[ro*0.98,-(L/2-e)],[ro*1.1,-(L/2-e)],[R,-L*0.16],[R,L*0.16],[ro*1.1,L/2-e],[ro*0.98,L/2-e]]));
  var top=G(), y0=R*0.92;
  top.add(solid([[0,y0],[R*0.78,y0],[R*0.62,y0+R*0.42],[0,y0+R*0.42]]));   /* plug top cover */
  if(op==='lever'){
    var P=Math.max(d*3.0,7);
    var stub=new THREE.Mesh(new THREE.CylinderGeometry(Math.max(n*0.06,0.14),Math.max(n*0.06,0.14),R*0.5,16),MAT.trim);
    stub.position.y=y0+R*0.55; top.add(stub);
    top.add(lever(P,y0+R*0.75));
  }else{
    var W=wheelDia(n,150)*0.78, H=stemH(n,150)*0.62;
    var st=new THREE.Mesh(new THREE.CylinderGeometry(n*0.06+0.13,n*0.06+0.13,H-y0,16),MAT.trim);
    st.position.y=(y0+H)/2; top.add(st); top.add(handwheel(W,H));
  }
  top.rotation.z=Math.PI/2; g.add(top);
  return {g:g,std:'Plug valve, ASME B16.10 end to end, Class '+(cl||150)+', '+endNm(end)+' ends',
    dims:[['Nominal size',fnps(n)],['Class',cl||150],['End to end',fx(L)+'"'],['Port bore',fx(d)+'"'],
      ['Connection',endNm(end)],['Operator',op==='lever'?'Hand lever':'Handwheel'],['Body','Lubricated / sleeved plug']],
    note:'Operator envelope proportional; body per B16.10 face-to-face'};
}

 {grp:'Plates',id:'OP',skey:'OP',name:'Orifice plate, Class 300',sz:S1([3,4,6,8,10,12],function(n){return genOrificePlate(300,n);})}
];

/* ============================================================ SCENE */
var scene,cam,rnd,root,clip,spin=true,cut=false,wire=false;
var cur={ci:0,si:0}, theta=-0.72, phi=1.18, dist=40, target=new THREE.Vector3();
function initScene(){
  var cv=document.getElementById('cv');
  rnd=new THREE.WebGLRenderer({canvas:cv,antialias:true});
  rnd.setPixelRatio(Math.min(devicePixelRatio,2));
  rnd.localClippingEnabled=true;
  scene=new THREE.Scene(); scene.background=new THREE.Color(0x0d1117);
  cam=new THREE.PerspectiveCamera(38,1,0.1,4000);
  scene.add(new THREE.HemisphereLight(0xdfe8f2,0x2a3038,0.85));
  var k=new THREE.DirectionalLight(0xffffff,0.85); k.position.set(1,1.6,1.1); scene.add(k);
  var f=new THREE.DirectionalLight(0x9fc4ea,0.35); f.position.set(-1.2,0.4,-1); scene.add(f);
  root=new THREE.Group(); scene.add(root);
  clip=new THREE.Plane(new THREE.Vector3(0,0,1),0);
  initMat();
  addEventListener('resize',resize); resize();
  var d=false,px=0,py=0,btn=0;
  cv.addEventListener('pointerdown',function(e){d=true;btn=e.button;px=e.clientX;py=e.clientY;cv.setPointerCapture(e.pointerId);});
  cv.addEventListener('pointerup',function(e){d=false;});
  cv.addEventListener('pointermove',function(e){
    if(!d)return; var dx=e.clientX-px,dy=e.clientY-py; px=e.clientX;py=e.clientY;
    if(btn===2){var s=dist*0.0016; target.x-=dx*s; target.y+=dy*s;}
    else{theta-=dx*0.008; phi=Math.max(0.12,Math.min(Math.PI-0.12,phi-dy*0.008)); spin=false; setChip('bSpin',false);}
  });
  cv.addEventListener('contextmenu',function(e){e.preventDefault();});
  cv.addEventListener('wheel',function(e){e.preventDefault();dist*=(e.deltaY>0?1.09:0.917);},{passive:false});
}
function resize(){
  var v=document.getElementById('view');
  rnd.setSize(v.clientWidth,v.clientHeight,false);
  cam.aspect=v.clientWidth/v.clientHeight; cam.updateProjectionMatrix();
}
function setChip(id,on){document.getElementById(id).classList.toggle('on',on);}
function applyStyle(){
  for(var k in MAT){MAT[k].wireframe=wire; MAT[k].clippingPlanes=cut?[clip]:[]; MAT[k].needsUpdate=true;}
}
function fit(){
  var b=new THREE.Box3().setFromObject(root); if(b.isEmpty())return;
  var c=b.getCenter(new THREE.Vector3()), s=b.getSize(new THREE.Vector3());
  target.copy(c); dist=Math.max(s.x,s.y,s.z)*1.95+3;
}
function build(){
  while(root.children.length) root.remove(root.children[0]);
  var c=CAT[cur.ci], e=c.sz[Math.min(cur.si,c.sz.length-1)], r=null;
  try{ r=e.f(); }catch(err){ console.error(err); }
  if(!r){ document.getElementById('info').innerHTML='<h4>Not available</h4>'; return; }
  var g=r.g; if(!r.noRot) g.rotation.z=-Math.PI/2;
  root.add(g); fit(); applyStyle();
  var h='<h4>'+c.name+'  <span style="color:var(--dim)">'+e.lab+(c.skey?'  \u00b7  SKEY '+c.skey:'')+'</span></h4><table>';
  r.dims.forEach(function(d){h+='<tr><td>'+d[0]+'</td><td class="v">'+d[1]+'</td></tr>';});
  h+='</table><div id="src">Dimensions from <b>'+r.std+'</b>'+(r.note?'<br>'+r.note:'')+'</div>';
  document.getElementById('info').innerHTML=h;
}
function drawList(){
  var L=document.getElementById('list'),h='',g0='';
  CAT.forEach(function(c,i){
    if(c.grp!==g0){h+='<div class="grp">'+c.grp+'</div>';g0=c.grp;}
    h+='<div class="it'+(i===cur.ci?' on':'')+'" data-i="'+i+'"><span class="sk">'+(c.skey||'\u2014')+'</span><span class="nm">'+c.name+'</span></div>';
  });
  L.innerHTML=h;
  Array.prototype.forEach.call(L.querySelectorAll('.it'),function(el){
    el.onclick=function(){cur.ci=+el.dataset.i;cur.si=Math.min(cur.si,CAT[cur.ci].sz.length-1);drawList();drawSizes();build();};
  });
}
function drawSizes(){
  var S=document.getElementById('sizes'),c=CAT[cur.ci],h='';
  c.sz.forEach(function(s,i){h+='<button class="chip'+(i===cur.si?' on':'')+'" data-i="'+i+'">'+s.lab+'</button>';});
  S.innerHTML=h;
  Array.prototype.forEach.call(S.querySelectorAll('.chip'),function(el){
    el.onclick=function(){cur.si=+el.dataset.i;drawSizes();build();};
  });
}
function loop(){
  requestAnimationFrame(loop);
  if(spin) theta+=0.0042;
  cam.position.set(target.x+dist*Math.sin(phi)*Math.cos(theta),target.y+dist*Math.cos(phi),target.z+dist*Math.sin(phi)*Math.sin(theta));
  cam.lookAt(target); rnd.render(scene,cam);
}
(function(){
  initScene();
  document.getElementById('bCut').onclick=function(){cut=!cut;setChip('bCut',cut);applyStyle();};
  document.getElementById('bWire').onclick=function(){wire=!wire;setChip('bWire',wire);applyStyle();};
  document.getElementById('bSpin').onclick=function(){spin=!spin;setChip('bSpin',spin);};
  document.getElementById('bFit').onclick=function(){fit();};
  cur.ci=CAT.findIndex(function(c){return c.id==='FLWN300';}); if(cur.ci<0)cur.ci=0; cur.si=7;
  drawList(); drawSizes(); build(); loop();
})();
</script></body></html>
